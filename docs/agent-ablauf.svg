<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8f96"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#1e1f22"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#dfe1e5">So arbeitet der Coding-Agent</text>
  <text x="32" y="68" font-size="13" fill="#8c8f96">Der Chat erkennt selbst, ob er nur antwortet, nachliest oder etwas ändert – du behältst die Kontrolle.</text>

  <g font-size="13" text-anchor="middle">
    <!-- Reihe 1 -->
    <rect x="32" y="100" width="160" height="70" rx="12" fill="#2b2d30"/>
    <text x="112" y="130" fill="#dfe1e5" font-weight="700">💬 Deine Aufgabe</text>
    <text x="112" y="150" fill="#8c8f96" font-size="12">„Behebe den Fehler …“</text>

    <rect x="232" y="100" width="160" height="70" rx="12" fill="#2b2d30"/>
    <text x="312" y="130" fill="#dfe1e5" font-weight="700">📂 Überblick</text>
    <text x="312" y="150" fill="#8c8f96" font-size="12">Struktur + Test-Befehl</text>

    <rect x="432" y="100" width="180" height="70" rx="12" fill="#2b2d30" stroke="#4f8cff"/>
    <text x="522" y="130" fill="#dfe1e5" font-weight="700">🧠 Modell plant</text>
    <text x="522" y="150" fill="#8c8f96" font-size="12">nächsten Werkzeug-Aufruf</text>

    <rect x="652" y="100" width="276" height="70" rx="12" fill="#2b2d30"/>
    <text x="790" y="128" fill="#dfe1e5" font-weight="700">🔍 Lesen, suchen, öffnen</text>
    <text x="790" y="150" fill="#4fbf7a" font-size="12">läuft direkt – ändert nichts</text>

    <!-- Reihe 2 -->
    <rect x="432" y="230" width="180" height="70" rx="12" fill="#2b2d30" stroke="#e0a84a"/>
    <text x="522" y="258" fill="#dfe1e5" font-weight="700">✅ Freigabe-Karte</text>
    <text x="522" y="278" fill="#e0a84a" font-size="12">Diff / Befehl – du entscheidest</text>

    <rect x="652" y="230" width="276" height="70" rx="12" fill="#2b2d30"/>
    <text x="790" y="256" fill="#dfe1e5" font-weight="700">✏️ Schreiben · $ Befehl</text>
    <text x="790" y="278" fill="#8c8f96" font-size="12">+ automatische Syntaxprüfung</text>

    <rect x="232" y="230" width="160" height="70" rx="12" fill="#2b2d30"/>
    <text x="312" y="258" fill="#dfe1e5" font-weight="700">🚫 Abgelehnt</text>
    <text x="312" y="278" fill="#8c8f96" font-size="12">Agent stoppt &amp; fragt</text>

    <!-- Reihe 3 -->
    <rect x="432" y="360" width="180" height="70" rx="12" fill="#2b2d30" stroke="#4f8cff"/>
    <text x="522" y="388" fill="#dfe1e5" font-weight="700">🧪 Abschluss-Prüfung</text>
    <text x="522" y="408" fill="#8c8f96" font-size="12">Tests grün? Alles angelegt?</text>

    <rect x="652" y="360" width="276" height="70" rx="12" fill="#2b2d30"/>
    <text x="790" y="388" fill="#dfe1e5" font-weight="700">📋 Zusammenfassung</text>
    <text x="790" y="408" fill="#8c8f96" font-size="12">was wirklich passiert ist · ↶ Rückgängig</text>

    <rect x="32" y="360" width="360" height="70" rx="12" fill="#232427" stroke="#393b40" stroke-dasharray="4 4"/>
    <text x="212" y="386" fill="#dfe1e5" font-weight="600" font-size="12">🛡️ Leitplanken</text>
    <text x="212" y="406" fill="#8c8f96" font-size="11">nur Projektordner · gefährliche Befehle fragen immer</text>
    <text x="212" y="422" fill="#8c8f96" font-size="11">erfundene Ergebnisse werden live gestoppt</text>
  </g>

  <!-- Pfeile -->
  <g stroke="#8c8f96" stroke-width="2" fill="none">
    <line x1="192" y1="135" x2="230" y2="135" marker-end="url(#p)"/>
    <line x1="392" y1="135" x2="430" y2="135" marker-end="url(#p)"/>
    <line x1="612" y1="135" x2="650" y2="135" marker-end="url(#p)"/>
    <path d="M790,170 L790,200 L560,200 L560,170" marker-end="url(#p)"/>
    <line x1="522" y1="170" x2="522" y2="228" marker-end="url(#p)"/>
    <line x1="612" y1="265" x2="650" y2="265" marker-end="url(#p)"/>
    <path d="M928,265 L944,265 L944,86 L522,86 L522,98" marker-end="url(#p)"/>
    <line x1="432" y1="265" x2="394" y2="265" marker-end="url(#p)"/>
    <path d="M432,160 L412,160 L412,395 L430,395" marker-end="url(#p)" stroke-dasharray="5 4"/>
    <line x1="612" y1="395" x2="650" y2="395" marker-end="url(#p)"/>
    <path d="M612,380 L632,380 L632,186 L596,186 L596,172" marker-end="url(#p)" stroke-dasharray="5 4"/>
  </g>
  <g font-size="11" fill="#8c8f96">
    <text x="640" y="196">Ergebnis zurück</text>
    <text x="530" y="214">ändert etwas</text>
    <text x="404" y="336" text-anchor="end">fertig?</text>
    <text x="640" y="340">noch nicht → weiter</text>
    <text x="800" y="80">Ergebnis zurück ans Modell</text>
  </g>
</svg>
